name: Update site

on:
  schedule:
    # Off-peak minutes, because GitHub often delays runs scheduled on the hour.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer run replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Only for the keepalive commit below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "scripts/*.test.mjs"
      - name: Collect and filter feeds
        run: node scripts/build-feed.mjs
        env:
          PREVIOUS_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/feed.json
      # GitHub pauses scheduled jobs in repositories with no commits for 60 days.
      - name: Keep the schedule running
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
